# Render Blueprint for the orchestrator (New → Blueprint → this repo).
# The Next.js app goes on Vercel separately (root directory: web/).
services:
  - type: web
    name: talk-orchestrator
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    plan: starter # free instances sleep after idle; a live session needs an awake process
    envVars:
      - key: LIVEAVATAR_API_KEY
        sync: false
      - key: LIVEAVATAR_AVATAR_ID
        value: 65f9e3c9-d48b-4118-b73a-4ae2e3cbb8f0
      - key: OPENAI_API_KEY
        sync: false
      - key: ORCHESTRATOR_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://your-app.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MAX_SESSION_SECONDS
        value: "300"
